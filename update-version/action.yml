name: '🎛️ Atualizar Versão'
description: 'Atualiza a versão do módulo e realiza um commit.'
inputs:
  version:
    description: 'Nova versão para ser definida no módulo.'
    required: true
  github_token:
    description: 'Token para clonar workspace'
    required: true 
runs:
  using: 'composite'
  steps:
    - name: 'Check Github Token'
      run: |
        if [ -z "${{ inputs.github_token }}" ]; then
          echo "GitHub Token não fornecido."
          exit 1
        else
          echo "GitHub Token está presente."
        fi
      shell: bash

    - name: 'Input Vars Verification'
      run: |
        if [ -z "${{ inputs.version }}" ]; then
          echo "Versão não fornecida."
          exit 1
        else
          echo "Versão fornecida: ${{ inputs.version }}"
        fi
      shell: bash

    - name: 'Github Repository Triggered by'
      run: |
        REPO_NAME=$(basename "${{ github.repository }}")
        echo "O nome do repositório que disparou a action é: $REPO_NAME"
        echo "repo_name=$REPO_NAME" >> $GITHUB_ENV
      shell: bash

    - name: 'Is a Core?'
      run: |
        IS_CORE=$([[ "$GITHUB_REPOSITORY" != "GEDPaciente/mv-ged-core" && "$GITHUB_REPOSITORY" != "GEDPaciente/mv-gap-core" ]] && echo true || echo false)
        echo "É um core? $IS_CORE"
        echo "is_core=$IS_CORE" >> $GITHUB_ENV
      shell: bash

    - name: 'Checkout Repositório Parent'
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref }}
        repository: GEDPaciente/mv-ged-parent
        token: ${{ inputs.github_token }}
        path: parent

    - name: 'Checkout Repositório do Módulo'
      uses: actions/checkout@v3
      with:
        token: ${{ inputs.github_token }}
        path: module

    - name: 'Check prop to update'
      if: ${{ env.is_core == 'true' }}
      run: |
        repo_name=$(cat $GITHUB_ENV | grep repo_name | cut -d'=' -f2)
        # Identificar a propriedade a ser alterada com base no repositório
        if [[ "$GITHUB_REPOSITORY" == "GEDPaciente/mv-ged-core" ]]; then
          PROPERTY_NAME="ged.core.version"
        elif [[ "$GITHUB_REPOSITORY" == "GEDPaciente/mv-gap-core" ]]; then
          PROPERTY_NAME="ged.auth.core.version"
        else
          exit 0
        fi

        echo "Variavel para alteração: $PROPERTY_NAME"

        # Salvar a propriedade em uma variável de ambiente
        echo "PROPERTY_NAME=$PROPERTY_NAME" >> $GITHUB_ENV
      shell: bash

    # Alterar a versão diretamente nos arquivos
    - name: 'Alterar versão no module/pom.xml'
      run: |
        # Alterar a versão do módulo diretamente no arquivo pom.xml
        sed -i 's|<version>.*</version>|<version>${{ inputs.version }}</version>|' module/pom.xml
        echo "Versão do módulo alterada para ${{ inputs.version }} no pom.xml"
        
        # Atualizar o package.json
        if [ -f module/package.json ]; then
          echo "Atualizando versão no package.json para ${{ inputs.version }}"
          jq --arg version "${{ inputs.version }}" '.version = $version' module/package.json > module/package.json.tmp
          mv module/package.json.tmp module/package.json
          git add module/package.json
        fi
      shell: bash

    - name: 'Alterar versão no parent/pom.xml'
      if: ${{ env.is_core == 'true' }}
      run: |
        # Alterar a versão no arquivo pom.xml do repositório pai
        PROPERTY_NAME=$(cat $GITHUB_ENV | grep PROPERTY_NAME | cut -d'=' -f2)
        sed -i "s|<${PROPERTY_NAME}>.*</${PROPERTY_NAME}>|<${PROPERTY_NAME}>${{ inputs.version }}</${PROPERTY_NAME}>|" parent/pom.xml
        echo "Versão do parent alterada para ${{ inputs.version }} no pom.xml"

        # Adicionar as mudanças no pom.xml ao staging
        git add parent/pom.xml

        # Configurar o usuário para o commit
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Comitar as mudanças no pom.xml
        git commit -m "Atualiza versão do $PROPERTY_NAME para ${{ inputs.version }}"

        # Fazer push da alteração para o repositório remoto
        git push
      shell: bash
